# Casbin 资源权限模型：主体 × 资源ID × 资源类型 × 操作 × 密级 × 角色 × 部门（与省市区无关）
#
# 请求七元组（全部为正则匹配字段，通配用 ".*"）:
#   r.sub      = user:{userId}          操作者
#   r.resId    = {docId}                资源实例ID（具体文档/合同的主键，".." 通配全部实例）
#   r.obj      = doc | contract         资源类型（doc 文档 / contract 合同，可扩展新资源）
#   r.act      = read | write | delete | grant
#   r.docLevel = "1"|"2"|"3"|"4"        密级（1公开 2部门 3机密 4区域，各资源类型通用）
#   r.role     = leader | member | none 当前用户在资源归属部门的角色（由 g 挂载解析）
#   r.dept     = dept:{deptId}          资源归属部门
#
# 角色来源：g 挂载（leader:dept:x / member:dept:x），由服务层解析为 leader/member/none
# 策略行示例（入库 v0~v6 七列）:
#   p, .*, .*, (doc|contract), ^(read|write|delete|grant)$, ^[1-4]$, ^leader$, .*   领导全资源全权
#   p, .*, .*, doc, ^read$, ^(1|2)$, ^member$, .*                                   成员读文档1-2级
#   p, ^user:10$, ^(4|7)$, ^(doc)$, ^read$, ^(3)$, .*, ^dept:1$                     实例级显式授权（仅doc 4/7）
[request_definition]
r = sub, resId, obj, act, docLevel, role, dept

[policy_definition]
p = sub, resId, obj, act, docLevel, role, dept

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = regexMatch(r.sub, p.sub) \
    && regexMatch(r.resId, p.resId) \
    && regexMatch(r.obj, p.obj) \
    && regexMatch(r.act, p.act) \
    && regexMatch(r.docLevel, p.docLevel) \
    && regexMatch(r.role, p.role) \
    && regexMatch(r.dept, p.dept)
